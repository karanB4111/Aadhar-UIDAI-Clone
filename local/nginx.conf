# nginx as a stand-in for the AWS ALB (PLAN step 3; ARCHITECTURE 5.2).
#
# Mapping to the real stack:
#   - upstream `app` plays the ALB's target group
#   - max_fails / fail_timeout play the health-check unhealthy threshold
#   - proxy_next_upstream retries one failed backend on the other, so a
#     stopped container causes the stand-in to try the survivor rather
#     than return 502 for the full detection window
#   - we proxy to port 8000 (uvicorn), the same port the ALB target
#     group uses on AWS
#
# This is the stand-in for failover rehearsal, NOT a measurement baseline:
# the step 4 prober measures AWS behaviour, where the ALB's own
# health-check settings (5 s interval, unhealthy 2, healthy 2) are what
# govern the timing. See ARCHITECTURE.md 5.2.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # The two application containers, by compose service name.
    # max_fails=1 fail_timeout=5s roughly matches "two missed 5 s checks":
    # after one failed proxy, the backend is skipped for 5 s before nginx
    # tries it again. Keeps the local demo snappy without pretending to
    # reproduce the ALB's exact detection curve.
    upstream app {
        server app-a:8000 max_fails=1 fail_timeout=5s;
        server app-b:8000 max_fails=1 fail_timeout=5s;
    }

    # Short timeouts: the service answers in milliseconds (service/README.md),
    # so a hung backend should be given up on quickly.
    proxy_connect_timeout 2s;
    proxy_send_timeout    5s;
    proxy_read_timeout    5s;

    server {
        listen 80;

        # Pass identity headers from the backend through to the client, so
        # the prober can see which app answered without parsing the body.
        proxy_pass_header X-Instance-Id;
        proxy_pass_header X-AZ;
        proxy_pass_header X-Region;
        proxy_pass_header X-App-Version;

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # If the chosen backend is down, try the other once before
            # giving up. This is nginx's own failover, not the health
            # check; the result is close enough for the rehearsal.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
